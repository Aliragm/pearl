ktor:
  deployment:
    port: 8080
  application:
    modules:
      - gg.pearl.plugins.HttpKt.configureHttp
      - gg.pearl.plugins.DIKt.configureDependencyInjection
      - gg.pearl.plugins.SerializationKt.configureSerialization
      - gg.pearl.plugins.StatusPagesKt.configureStatusPages
      - gg.pearl.plugins.DatabasesKt.configureDatabases
      - gg.pearl.plugins.SecurityKt.configureSecurity
      - gg.pearl.RoutingKt.configureRouting
  jwt:
    secret:
      - "secret"
    issuer:
      - "http://0.0.0.0:8080/"
    audience:
      - "http://0.0.0.0:8080/api"
    realm:
      - "Access to 'api'"

database:
  url: "$DB_URL:jdbc:postgresql://localhost:5432/pearl_db"
  user: "$DB_USER:postgres"
  password: "$DB_PASSWORD:postgres"

ingestor:
  grpc:
    host: "$INGESTOR_GRPC_HOST:localhost"
    port: "$INGESTOR_GRPC_PORT:8081"
    deadlineMs: "$INGESTOR_GRPC_DEADLINE_MS:3000"
