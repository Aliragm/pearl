name: Pearl.gg Monorepo CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-ktor:
    name: Backend (Kotlin / Ktor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test Backend
        run: ./gradlew :backend:test --no-daemon

  mobile-kmp:
    name: Mobile Client (KMP / Compose Multiplatform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test Mobile KMP Module
        run: ./gradlew :mobile:desktopTest --no-daemon

  ingestor-go:
    name: Ingestor Microservice (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test Go Microservice
        run: |
          cd services/ingestor-go
          go test -v ./...
