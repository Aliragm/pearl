syntax = "proto3";

option go_package = "github.com/Aliragm/pearl/services/ingestor-go/proto";

package gameservice;

// GameService expõe operações de busca de jogos na API externa (IGDB).
service GameService {
  // Search busca jogos pelo nome e retorna uma lista normalizada.
  rpc Search(SearchGameRequest) returns (SearchGameResponse);
}

// SearchGameRequest representa o termo de busca enviado pelo cliente.
message SearchGameRequest {
  string searchString = 1;
}

// Game representa os dados normalizados de um jogo.
message Game {
  int32 id = 1;
  repeated string platforms = 2;
  string name = 3;
  string summary = 4;
  repeated string companies = 5;
  string cover_url = 6;
}

// SearchGameResponse contém a lista de jogos encontrados.
message SearchGameResponse {
  repeated Game games = 1;
}
